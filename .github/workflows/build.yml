name: 自动编译 Windows 程序

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow
          pip install mediapipe
          REM 解决冲突：mediapipe 自带 opencv-python，替换为 headless 版以减小体积
          pip uninstall -y opencv-python opencv-contrib-python
          pip install opencv-python-headless
          pip install pyinstaller

      - name: 验证依赖
        run: |
          python -c "import cv2, numpy, PIL, mediapipe; print('依赖加载正常')"

      - name: 打包为 exe
        run: pyinstaller --noconfirm BlinkAlarm.spec

      - name: 生成校验信息
        run: dir dist

      - name: 上传可执行文件（供下载）
        uses: actions/upload-artifact@v4
        with:
          name: BlinkAlarm-Windows
          path: dist/BlinkAlarm.exe
          retention-days: 30

      - name: 发布 Release（仅在打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BlinkAlarm.exe
          generate_release_notes: true
