name: 自动编译 Windows 程序

on:
  push:
    branches: [ main, master, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 运行单元测试（眨眼算法 + 模型推理）
        run: dotnet test tests/BlinkAlarm.Tests -c Release

      - name: 打包为单个 exe（自带 .NET 运行库，无需另外安装）
        run: >
          dotnet publish src/BlinkAlarm.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          -o publish

      - name: 自检（加载模型、渲染界面并截图）
        shell: pwsh
        run: |
          $out = Join-Path $PWD "selftest"
          $process = Start-Process -FilePath "publish\BlinkAlarm.exe" -ArgumentList "--self-test", "`"$out`"" -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw "自检超时" }
          if (Test-Path "$out\result.txt") { Get-Content "$out\result.txt" -Encoding UTF8 }
          if ($process.ExitCode -ne 0) { throw "自检失败，退出码 $($process.ExitCode)" }
          Get-ChildItem publish, $out | Format-Table Name, Length

      - name: 附带许可证
        shell: pwsh
        run: |
          Copy-Item THIRD-PARTY-NOTICES.md publish/
          Copy-Item ThirdPartyLicenses/Apache-2.0.txt publish/

      - name: 上传可执行文件（供下载）
        uses: actions/upload-artifact@v4
        with:
          name: BlinkAlarm-Windows
          path: |
            publish/BlinkAlarm.exe
            publish/THIRD-PARTY-NOTICES.md
            publish/Apache-2.0.txt
          if-no-files-found: error
          retention-days: 30

      - name: 上传界面截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlinkAlarm-Screenshots
          path: selftest/
          retention-days: 14

      - name: 发布 Release（仅在打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/BlinkAlarm.exe
          generate_release_notes: true
